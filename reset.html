<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Festa Fantasia - Atualizando...</title>
  <style>
    body {
      background: #0c0c0f;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid #24242d;
      border-top-color: #b21f24;
      border-radius: 50%;
      animation: spin 0.8s infinite linear;
    }
    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h2 style="margin-top: 24px; font-size: 1.25rem;">Atualizando Festa Fantasia...</h2>
  <p style="color: #a1a1aa; font-size: 0.9rem; margin-top: 8px;">Atualizando dados mais recentes. Redirecionando...</p>

  <script>
    async function clearAll() {
      if ('serviceWorker' in navigator) {
        const regs = await navigator.serviceWorker.getRegistrations();
        for (const r of regs) {
          await r.unregister();
        }
      }

      if ('caches' in window) {
        const keys = await caches.keys();
        for (const k of keys) {
          await caches.delete(k);
        }
      }

      try {
        localStorage.removeItem('halloween_escola_fantasias');
        localStorage.removeItem('halloween_escola_config');
        localStorage.removeItem('halloween_escola_meus_votos');
        localStorage.removeItem('halloween_etec_fantasias');
        localStorage.removeItem('halloween_etec_config');
        localStorage.removeItem('halloween_etec_meus_votos');
      } catch (e) {}

      setTimeout(function() {
        window.location.href = 'index.html?v=' + Date.now();
      }, 600);
    }

    clearAll();
  </script>
</body>
</html>
